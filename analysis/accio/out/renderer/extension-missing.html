<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accio Browser Relay Not Found</title>
    <!--
      Self-contained on purpose: this page renders when the bundled extension
      folder is missing, so it cannot link styles/install-common.css or the
      extension icons. Tokens and classes below mirror install-common.css.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --accent: #14b8a6;
        --accent-soft: color-mix(in oklab, var(--accent) 10%, transparent);
        --accent-border: color-mix(in oklab, var(--accent) 25%, transparent);
        --surface: color-mix(in oklab, canvas 95%, canvasText 5%);
        --border: color-mix(in oklab, canvasText 8%, transparent);
        --muted: color-mix(in oklab, canvasText 50%, transparent);
        --dim: color-mix(in oklab, canvasText 25%, transparent);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        line-height: 1.6;
        color: canvasText;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: canvas;
      }

      .drag-handle {
        -webkit-app-region: drag;
        height: 38px;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
      }

      .page {
        max-width: 860px;
        margin: 0 auto;
        padding: 56px 40px 80px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 12px;
      }

      .header-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        color: var(--accent);
      }

      .header-icon svg {
        width: 28px;
        height: 28px;
      }

      @media (prefers-color-scheme: dark) {
        .header-icon {
          background: #e8ecef;
          border-color: #d1d5db;
        }
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .title-tag {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        color: var(--accent);
        white-space: nowrap;
      }

      .subtitle {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 24px;
      }

      .path-label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
      }

      .path-display {
        display: block;
        margin: 10px 0 4px;
        padding: 10px 14px;
        border-radius: 8px;
        background: color-mix(in oklab, canvas 80%, canvasText 5%);
        border: 1px solid var(--border);
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
        line-height: 1.5;
        color: canvasText;
      }

      .store-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      .store-btn:hover {
        background: color-mix(in oklab, var(--accent) 88%, black);
      }
    </style>
  </head>
  <body>
    <div class="drag-handle"></div>
    <div class="page">
      <div class="header">
        <div class="header-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M3 6.5A1.5 1.5 0 014.5 5h15A1.5 1.5 0 0121 6.5v11a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5z"
            />
            <path d="M9 10l6 4" />
            <path d="M15 10l-6 4" />
          </svg>
        </div>
        <div>
          <h1>
            <span data-i18n="title">Accio Browser Relay Not Found</span>
            <span class="title-tag" data-i18n="title_tag">Files Missing</span>
          </h1>
        </div>
      </div>
      <p class="subtitle" data-i18n="subtitle">
        The connection guide cannot open because the bundled browser extension folder is missing or
        was deleted. Reinstall or repair Accio, then try connecting again.
      </p>

      <a
        class="store-btn"
        href="https://chromewebstore.google.com/detail/accio-browser-relay/allhanmilpgeamlpoanonpgognlofono"
        target="_blank"
        rel="noopener"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 8.5V12a1.5 1.5 0 01-1.5 1.5h-7A1.5 1.5 0 012 12V5a1.5 1.5 0 011.5-1.5H7" />
          <path d="M10 2h4v4" />
          <path d="M7 9L14 2" />
        </svg>
        <span data-i18n="store_install">Install from Chrome Web Store</span>
      </a>

      <span class="path-label" data-i18n="path_label">Expected location</span>
      <code class="path-display" id="extension-path"></code>
    </div>

    <script>
      ;(function () {
        var COPY = {
          en: {
            title: 'Accio Browser Relay Not Found',
            title_tag: 'Files Missing',
            subtitle:
              'The manual install guide cannot open because the bundled browser extension folder is missing or was deleted. Install from the Chrome Web Store instead, or reinstall Accio to restore the files.',
            store_install: 'Install from Chrome Web Store',
            path_label: 'Expected location',
          },
          zh: {
            title: '未找到 Accio Browser Relay',
            title_tag: '文件缺失',
            subtitle:
              '随应用打包的浏览器扩展文件夹已丢失或被删除，无法打开手动安装引导。请改从 Chrome 应用商店安装，或重新安装 Accio 以恢复文件。',
            store_install: '前往 Chrome 应用商店安装',
            path_label: '预期位置',
          },
        }

        var params = new URLSearchParams(window.location.search)
        var lang = String(params.get('lang') || 'en')
          .toLowerCase()
          .split(/[-_]/)[0]
        var dict = COPY[lang] || COPY.en

        document.documentElement.lang = COPY[lang] ? lang : 'en'
        document.querySelectorAll('[data-i18n]').forEach(function (node) {
          var value = dict[node.getAttribute('data-i18n')]
          if (value) node.textContent = value
        })

        var path = params.get('extensionPath')
        var pathEl = document.getElementById('extension-path')
        if (path) {
          pathEl.textContent = path
        } else {
          pathEl.remove()
          document.querySelector('.path-label').remove()
        }
      })()
    </script>
  </body>
</html>
