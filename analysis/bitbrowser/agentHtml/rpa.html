<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPA</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        text-align: center;
        background: #f5f5f5;
      }
      img {
        max-width: 100%;
        width: 1200px;
      }
    </style>
    <script src="./js/rpa.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const url = new URL(document.location)
        const locale = url.searchParams.get('locale') || 'en'
        let langMap = {
          zh: 'rpa-zh',
          vi: 'rpa-vi',
          fr: 'rpa-fr',
          hk: 'rpa-hk',
          it: 'rpa-it',
          ru: 'rpa-ru',
          tr: 'rpa-tr',
          uk: 'rpa-uk'
        }
        if (locale === 'zh') {
          document.title = 'RPA-比特浏览器'
          document.querySelector('.rpa-img').setAttribute('src', `./${langMap.zh}.webp`)
        } else {
          document.title = 'RPA-BitBrowser'
          let imgName = 'rpa-en'
          if (langMap[locale]) {
            imgName = langMap[locale]
          }
          document.querySelector('.rpa-img').setAttribute('src', `./${imgName}.webp`)
        }
      })
    </script>
  </head>
  <body>
    <img class="rpa-img" src="" alt="" />
  </body>
</html>
