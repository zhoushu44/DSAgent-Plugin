<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Error</title>
  </head>
  <style>
    .btn {
      background-color: #2f54eb;
      outline: none;
      border-radius: 3px;
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
      outline: 0;
      border: 0;
      vertical-align: middle;
      font-size: 12px;
      text-decoration: none;
      color: #fff !important;
      font-weight: 500;
      text-align: center;
      width: auto;
      height: auto;
      cursor: default;
      padding: 6px 16px;
      cursor: pointer;
      width: 160px;
    }
    .cancel {
      background-color: #f5222d;
    }
  </style>
  <body>
    <img src="./phoneError.png" alt="" style="width: 100%" />
    <p style="text-align: center; font-size: 12px" id="againOpen"></p>
    <div style="display: flex; justify-content: center"><button id="reload" class="btn"></button></div>
    <div style="display: flex; justify-content: center; margin-top: 10px">
      <button id="close" class="btn cancel"></button>
    </div>
  </body>

  <script src="./js/index.js"></script>
</html>
