<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitBrowser</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'PingFangSC-Regular', 'SourceHanSansCN Regular', 'Microsoft YaHei Regular', 'Montserrat Regular', sans-serif;
      }
      body {
        background: url('./bit-loading-bg.png') no-repeat top center;
      }
      .bit-loading {
        text-align: center;
        width: 100%;
        padding-top: 120px;
        box-sizing: border-box;
        position: relative;
      }
      .bit-loading p.title {
        color: #1a42e3;
        font-size: 14px;
        line-height: 30px;
      }
      .remark {
        font-size: 12px;
        color: #666;
        margin-top: 30px;
        padding: 0 20px;
      }
      header {
        display: flex;
        height: 30px;
      }
      header .drag {
        flex: 1;
        -webkit-app-region: drag;
        -webkit-user-select: none;
        user-select: none;
      }
      .exit-btn {
        width: 30px;
        height: 30px;
        line-height: 30px;
        text-align: center;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
        border-bottom-left-radius: 5px;
      }
      .exit-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
      .switch-lines {
        background: rgba(255, 255, 255, 0.2);
        padding-left: 10px;
        border-bottom-right-radius: 5px;
      }
      .switch-lines select {
        height: 30px;
        color: #fff;
        outline: none;
        border: none;
        background: none;
        cursor: pointer;
      }
      .switch-lines select option {
        color: #000;
      }
      .mac-header {
        flex-direction: row-reverse;
      }
      .mac-header .exit-btn {
        width: 14px;
        height: 14px;
        background: red;
        border-radius: 14px;
        margin: 8px;
        font-size: 9px;
        line-height: 14px;
      }
      .mac-header .switch-lines {
        background: none;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="switch-lines">
        <select name="line" id="line"></select>
      </div>
      <div class="drag"></div>
      <div class="exit-btn">X</div>
    </header>
    <div class="bit-loading">
      <svg fill="#1a42e3" width="135px" height="40px" viewBox="0 0 135 140" xmlns="http://www.w3.org/2000/svg">
        <rect y="10" width="15" height="120" rx="6">
          <animate
            attributeName="height"
            begin="0.5s"
            dur="1s"
            values="120;110;100;90;80;70;60;50;40;140;120"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
          <animate
            attributeName="y"
            begin="0.5s"
            dur="1s"
            values="10;15;20;25;30;35;40;45;50;0;10"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
        </rect>
        <rect x="30" y="10" width="15" height="120" rx="6">
          <animate
            attributeName="height"
            begin="0.25s"
            dur="1s"
            values="120;110;100;90;80;70;60;50;40;140;120"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
          <animate
            attributeName="y"
            begin="0.25s"
            dur="1s"
            values="10;15;20;25;30;35;40;45;50;0;10"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
        </rect>
        <rect x="60" width="15" height="140" rx="6">
          <animate
            attributeName="height"
            begin="0s"
            dur="1s"
            values="120;110;100;90;80;70;60;50;40;140;120"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
          <animate
            attributeName="y"
            begin="0s"
            dur="1s"
            values="10;15;20;25;30;35;40;45;50;0;10"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
        </rect>
        <rect x="90" y="10" width="15" height="120" rx="6">
          <animate
            attributeName="height"
            begin="0.25s"
            dur="1s"
            values="120;110;100;90;80;70;60;50;40;140;120"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
          <animate
            attributeName="y"
            begin="0.25s"
            dur="1s"
            values="10;15;20;25;30;35;40;45;50;0;10"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
        </rect>
        <rect x="120" y="10" width="15" height="120" rx="6">
          <animate
            attributeName="height"
            begin="0.5s"
            dur="1s"
            values="120;110;100;90;80;70;60;50;40;140;120"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
          <animate
            attributeName="y"
            begin="0.5s"
            dur="1s"
            values="10;15;20;25;30;35;40;45;50;0;10"
            calcMode="linear"
            repeatCount="indefinite"
          ></animate>
        </rect>
      </svg>
      <p class="title">BitBrowser Запуск...</p>
      <p class="remark">Если не удается запуститься долгое время, попробуйте сменить линию и подождите немного.</p>
    </div>

    <script>
      if (window.isMac) {
        document.querySelector('header').setAttribute('class', 'mac-header')
      }

      registerEvent()

      initialLines()

      // 设置切换线路
      async function initialLines() {
        const { active, lines } = await bitClientMain.getServiceLine()
        const selectEl = document.querySelector('#line')

        let optionHtml = ''
        for (const obj of lines) {
          optionHtml += `<option value="${obj.value}" label="${obj.label.replace('线路', 'линия ')}"></option>`
        }
        selectEl.innerHTML = optionHtml

        selectEl.value = active

        // 切换线路
        selectEl.addEventListener('change', e => {
          window.bitClientMain.changeServiceLine(e.target.value)
        })
      }

      // 注册事件
      function registerEvent() {
        document.querySelector('.exit-btn').addEventListener('click', window.exitWhenLoading)
      }
    </script>
  </body>
</html>
