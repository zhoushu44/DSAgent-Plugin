name: 批量下载B站视频
category: 数据采集
mode: batch
count_input: count
description: |
  批量下载 B 站视频：输入关键词和数量，逐个调用 bilibili-download 技能下载视频。
  适用于批量素材采集场景。
inputs:
  - key: keyword
    label: 搜索关键词
    type: text
    required: true
    default: ""
  - key: count
    label: 下载数量
    type: number
    required: true
    default: "5"
    min: 1
    max: 100
steps:
  - name: 下载视频
    skill: bilibili-download
    args:
      keyword: "{{keyword}}"
      index: "{{loop.index}}"
    output: step1
    on_failure: continue
