name: 闲鱼同行采集到合规物料
category: 店铺经营
mode: single
description: |
  一个关键词一条完整上架链路的前两段：
  ① 采集同行：拉该关键词下的在售链接（价格 / 想要数 / 卖家 / 主图），用于定价锚点与差异化定位；
  ② 出合规物料：按违禁词闸门生成 3 张主图 + 标题 + 描述 + listing.json。

  ★ 为什么第三段「发布」不在工作流里：
    xianyu-publish 是纯指令型技能（无脚本入口），引擎六项校验的第二项会直接拒绝它，
    存模板时就会报「是纯指令型（无可执行入口），不能作为步骤」。
    所以发布放在对话里用 dsagent_xianyu_publish 两步走：先出预览 → 你确认 → 拿 item 链接。

  ★ 为什么刻意单次执行（mode: single）而不是按数量循环：
    2026-10-15 用同一套模板批量发 8 条，全部被下架。平台判定要点是
    「同模板批量铺货」+「类目错放」。所以一次只出一条，换词换图再跑第二次。

  ★ 合规闸门硬拦截这些写法（命中即失败退出，不是提醒）：
    · 冒充官方：官方N折 / 官方直营 / 官方授权 / 官方渠道 / 官方正品
    · 贬损同业：不掺量 / 不共享 / 不做套路 / 套路 / 别家的坑 / 为什么选我们
    · 极限词：最低最便宜 / 第一 / 100% / 唯一 / 绝对
    · 虚假稀缺：仅剩 / 最后一天
    「非官方直营」是否定式披露，会被放行。

  ★ 选词原则（2026-10-20 实测）：
    主战场是模型名本身。行业黑话（API中转 / 中转token / GPT API）在闲鱼搜索 0 条结果。
inputs:
  - key: keyword
    label: 关键词（同行搜索词，如 Kimi API）
    type: text
    default: Kimi API
    required: true
  - key: discount
    label: 折扣口径（勿写「官方N折」）
    type: text
    default: 官网价 2 折起
    required: true
  - key: price
    label: 参考价（元）
    type: text
    default: "1"
    required: false
  - key: models
    label: 支持模型（逗号分隔）
    type: text
    default: DeepSeek,Claude,GPT,Gemini,GLM,Kimi,Qwen,MiniMax
    required: false
  - key: size
    label: 采集同行条数
    type: number
    default: "30"
    required: false
    min: 1
    max: 50
  - key: out
    label: 物料输出目录（留空=工作区 xianyu-out）
    type: text
    default: ""
    required: false
steps:
  - name: 采集同行
    skill: xianyu-crawl
    args:
      keyword: "{{keyword}}"
      size: "{{size}}"
    output: rivals
  - name: 生成合规物料
    skill: xianyu-listing-prep
    args:
      keyword: "{{keyword}}"
      discount: "{{discount}}"
      price: "{{price}}"
      models: "{{models}}"
      out: "{{out}}"
    output: listing
