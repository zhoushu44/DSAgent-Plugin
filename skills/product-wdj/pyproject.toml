## 功能

获取淘宝/天猫商品「问大家」问答列表与回答详情，导出 CSV、JSON 与 HTML 报告。

## 前置条件

1. 在 **平台连接** 添加并登录 **淘宝买家账号**（`platform=taobao`）
2. 将该账号 **绑定到当前对话的智能体**

